default_profile: paper

profiles:
  dev:
    starting_cash: 100000.0
    max_position_pct: 0.25
    max_open_positions: 5
    max_daily_loss_pct: 0.05
    slippage_bps: 5.0
    commission_per_fill: 0.0
    poll_interval_sec: 60
    journal_path: data/journal_dev.db
    health_path: data/health.json
    stop_file: data/STOP
  paper:
    starting_cash: 100000.0
    max_position_pct: 0.20
    max_open_positions: 4
    max_daily_loss_pct: 0.03
    slippage_bps: 8.0
    commission_per_fill: 1.0
    poll_interval_sec: 30
    journal_path: data/journal_paper.db
    health_path: data/health.json
    stop_file: data/STOP
  live:
    starting_cash: 100000.0
    max_position_pct: 0.10
    max_open_positions: 3
    max_daily_loss_pct: 0.02
    slippage_bps: 10.0
    commission_per_fill: 1.0
    poll_interval_sec: 15
    journal_path: data/journal_live.db
    health_path: data/health.json
    stop_file: data/STOP

strategies:
  sma:
    fast: 5
    slow: 20
  rsi:
    period: 14
    oversold: 30.0
    overbought: 70.0
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    window: 20
    num_std: 2.0
  momentum:
    lookback: 10
    entry_threshold: 0.03
    exit_threshold: 0.0
  atr_breakout:
    channel: 20
    atr_period: 14
    atr_mult: 1.5

sizing:
  default: fixed
  fixed:
    fraction: 0.2
  vol:
    target_vol: 0.15
    lookback: 20
    max_fraction: 0.35
  atr:
    risk_pct: 0.01
    atr_period: 14
    atr_stop_mult: 2.0
    max_fraction: 0.3
  kelly:
    win_rate: 0.55
    avg_win: 1.0
    avg_loss: 1.0
    fraction_of_kelly: 0.5
    max_fraction: 0.25
