[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "money-printer"
version = "0.2.0"
description = "Paper-trading automation: data ingest, strategies, brokers, analytics, walk-forward"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.3"]

[project.scripts]
money-printer = "money_printer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["money_printer"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 55
